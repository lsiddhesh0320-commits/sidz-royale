<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>SIDz ROYALE</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="loading">LOADING SIDz ROYALE…</div>
  <div id="menu" class="panel">
    <div class="logo">SIDz <span>ROYALE</span></div>
    <p>3D Battle Royale Prototype</p>
    <button id="playBtn">PLAY</button>
    <small>WASD / Arrow keys • Mouse to look • Space to jump<br>Mobile: left pad to move • drag right side to look</small>
  </div>
  <div id="hud" class="hidden">
    <div class="topbar"><span id="alive">ALIVE 11</span><span id="zone">ZONE 100%</span><span id="kills">KILLS 0</span></div>
    <div id="crosshair">+</div>
    <div id="message">Find the safe zone!</div>
    <div id="joystick"><div id="stick"></div></div>
    <div class="actions">
      <button id="jumpBtn">JUMP</button>
      <button id="sprintBtn">RUN</button>
      <button id="fireBtn">FIRE</button>
    </div>
  </div>
  <div id="end" class="panel hidden">
    <div class="logo">MATCH <span>OVER</span></div>
    <p id="endText">Good game!</p>
    <button id="againBtn">PLAY AGAIN</button>
  </div>
  <script type="module" src="game.js"></script>
</body>
</html>
